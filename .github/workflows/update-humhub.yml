---
name: Auto Update HumHub

on:
  repository_dispatch:
    types: check-update
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  execute:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-17
      - name: Set git config
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
      - name: Execute Update
        id: update
        run: |
          . ./update.sh
          { echo "CUR_VERSION=$CUR_VERSION"; echo "NEW_VERSION=$NEW_VERSION"; echo "GIT_BRANCH=$GIT_BRANCH"; } >> "$GITHUB_ENV"
      - name: Check git status and log
        run: |
          git status
          git log
      - name: Push changes
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # v1.3.0, 2026-05-24
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: "${{ env.GIT_BRANCH }}"
      - name: Create Pull Request
        uses: repo-sync/pull-request@7e79a9f5dc3ad0ce53138f01df2fad14a04831c5 # v2.12.1, 2023-01-21
        with:
          source_branch: "${{ env.GIT_BRANCH }}"
          destination_branch: "master"
          pr_title: "Bump HumHub to ${{ env.NEW_VERSION }}"
          github_token: ${{ secrets.GITHUB_TOKEN }}
